name: Build MyraBuddy 26.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Mod
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find MyraBuddy ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            -name 'MyraBuddy-26.3-Playable-Entity-FIXED.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Fixed MyraBuddy ZIP not found."
            echo "Files found:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract MyraBuddy project
        run: |
          rm -rf project
          mkdir project

          unzip -q \
            "${{ steps.find_zip.outputs.zip }}" \
            -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | sort

      - name: Detect project root
        id: project
        shell: bash
        run: |
          set -e

          ROOT="project"

          if [ ! -f "$ROOT/build.gradle" ] && [ ! -f "$ROOT/build.gradle.kts" ]; then
            FOUND=$(find "$ROOT" -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              | head -n 1)

            if [ -z "$FOUND" ]; then
              echo "ERROR: build.gradle not found."
              exit 1
            fi

            ROOT=$(dirname "$FOUND")
          fi

          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft mod
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Find generated JAR
        id: jar
        shell: bash
        run: |
          set -e

          JAR=$(find "${{ steps.project.outputs.root }}/build/libs" \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR was generated."
            exit 1
          fi

          echo "Generated JAR: $JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload MyraBuddy JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyraBuddy-26.3-JAR
          path: ${{ steps.jar.outputs.jar }}
          if-no-files-found: error
