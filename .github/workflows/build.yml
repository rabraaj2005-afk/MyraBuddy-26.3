name: Build MyraBuddy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find MyraBuddy ZIP
        id: findzip
        shell: bash
        run: |
          ZIP=$(find . -type f -name 'MyraBuddy-26.3-Playable-Entity.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP not found."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          mkdir project
          unzip -q "${{ steps.findzip.outputs.zip }}" -d project

      - name: Show project files
        run: |
          find project -maxdepth 4 -type f | sort

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MyraBuddy
        working-directory: project
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload MyraBuddy JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyraBuddy-26.3
          path: project/build/libs/*.jar
